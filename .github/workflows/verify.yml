name: Verify skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit and package tests
        run: python -m unittest discover -s tests -v

      - name: Validate the decision-record template
        run: python design-thinking/scripts/check_decision_record.py design-thinking/assets/decision-record-template.json --mode draft
