<clipPath id="c0"><rect class="t0" x="24" y="60" width="640" height="26"/></clipPath><g class="f0"><g clip-path="url(#c0)"><text x="28" y="78" fill="#93c5fd" font-weight="400" font-size="14"><tspan fill="#8d929b">›</tspan> add team workspaces with invites, a 14-day trial, and CSV export</text></g></g><g class="f1"><text x="28" y="110" fill="#8d929b" font-weight="400" font-size="14">● Building workspaces, invites, billing, and export</text></g><g class="f2"><text x="28" y="134" fill="#e7e7e4" font-weight="400" font-size="14">  <tspan fill="#4ade80">✓</tspan> 14 files changed, tests pass</text></g><g class="f3"><text x="28" y="158" fill="#8d929b" font-weight="400" font-size="14">● guesswork log  <tspan fill="#a5b4fc">7 decisions recorded</tspan></text></g><g class="f4"><rect x="20" y="178" width="840" height="226" rx="12" fill="#1b1f26" stroke="#262a31"/><text x="40" y="208" fill="#e7e7e4" font-weight="700" font-size="15">Guesswork <tspan fill="#8d929b">·</tspan> 3 decisions need you <tspan fill="#8d929b">(2 high stakes)</tspan></text><text x="40" y="242" fill="#8d929b" font-weight="400" font-size="14">1  <tspan fill="#e7e7e4" font-weight="600">Deleting a workspace erases it immediately</tspan></text><text x="560" y="242" fill="#e7e7e4" font-weight="400" font-size="13"><tspan fill="#fb923c" font-weight="700">HIGH</tspan> <tspan fill="#8d929b">· data</tspan></text><text x="64" y="264" fill="#8d929b" font-weight="400" font-size="13">a keep as built   b 30-day restore window   c type the name to confirm</text><text x="40" y="294" fill="#8d929b" font-weight="400" font-size="14">2  <tspan fill="#e7e7e4" font-weight="600">CSV exports include every member&#x27;s email</tspan></text><text x="560" y="294" fill="#e7e7e4" font-weight="400" font-size="13"><tspan fill="#fb923c" font-weight="700">HIGH</tspan> <tspan fill="#8d929b">· privacy</tspan></text><text x="64" y="316" fill="#8d929b" font-weight="400" font-size="13">a keep as built   b admins only   c leave emails out</text><text x="40" y="346" fill="#8d929b" font-weight="400" font-size="14">3  <tspan fill="#e7e7e4" font-weight="600">Every new comment emails all members</tspan></text><text x="560" y="346" fill="#e7e7e4" font-weight="400" font-size="13"><tspan fill="#facc15" font-weight="700">MED</tspan> <tspan fill="#8d929b">· notifications</tspan></text><text x="64" y="368" fill="#8d929b" font-weight="400" font-size="13">a keep as built   b mentions only   c daily digest</text><text x="40" y="388" fill="#8d929b" font-weight="400" font-size="13">Reply with your picks, like <tspan fill="#93c5fd">1b 2c 3b</tspan></text></g><clipPath id="c5"><rect class="t5" x="24" y="422" width="130" height="26"/></clipPath><g class="f5"><g clip-path="url(#c5)"><text x="28" y="440" fill="#93c5fd" font-weight="400" font-size="14"><tspan fill="#8d929b">›</tspan> 1b 2c 3b</text></g></g><g class="f6"><text x="28" y="470" fill="#8d929b" font-weight="400" font-size="14">● Applying your answers</text></g><g class="f7"><text x="28" y="494" fill="#e7e7e4" font-weight="400" font-size="14">  <tspan fill="#4ade80">✓</tspan> Deleted workspaces can be restored for 30 days</text></g><g class="f8"><text x="28" y="516" fill="#e7e7e4" font-weight="400" font-size="14">  <tspan fill="#4ade80">✓</tspan> Exports leave email addresses out</text></g><g class="f9"><text x="28" y="538" fill="#e7e7e4" font-weight="400" font-size="14">  <tspan fill="#4ade80">✓</tspan> Comment emails go only to people who are mentioned</text></g><g class="f10"><text x="28" y="570" fill="#e7e7e4" font-weight="600" font-size="14"><tspan fill="#a5b4fc">◆ 3 decisions locked.</tspan> Later sessions, pull requests, and CI respect them.</text></g>
