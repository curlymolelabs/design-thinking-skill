name: Verify skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit and package tests
        run: python -m unittest discover -s tests -v

      - name: Validate the decision-record template
        run: python design-thinking/scripts/check_decision_record.py design-thinking/assets/decision-record-template.json --mode draft

      - name: Check the paired evaluation plan
        run: python scripts/run_behavior_eval.py --client claude --trials 3 --dry-run

      - name: Validate the Guesswork ledgers
        run: |
          python guesswork/scripts/guesswork.py validate
          python guesswork/scripts/guesswork.py --root examples/fictional-workspace-app validate

  decisions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Summarize the decisions in this pull request
        uses: ./
        with:
          fail-on: never

  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Confirm installer discovery
        run: npx --yes skills add . --list
